server {
    listen 80;
    server_name localhost;

    # 容器启动脚本可通过 FILESHARE_MAX_UPLOAD_BODY_BYTES 覆盖此默认值。
    client_max_body_size 110m;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    error_page 413 = @api_payload_too_large;

    # 启用 Gzip 压缩，提高静态资源加载速度
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # 根路径自动跳转到系统基址
    location = / {
        return 301 /fileshare/;
    }

    # 前端静态资源代理，适配 Vue History 路由模式
    location /fileshare/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /fileshare/index.html;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://fileshare-server:29000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # 分片请求不在 Nginx 缓冲完整正文，避免大分片占用前端容器内存。
    location ^~ /api/fileshare/v1/management/uploads/ {
        proxy_pass http://fileshare-server:29000/api/fileshare/v1/management/uploads/;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI 仍由后端仅限调试环境的显式开关控制。
    location /swagger/ {
        proxy_pass http://fileshare-server:29000/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 错误页面处理
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    location @api_payload_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"code":413,"message":"请求体超过系统限制","details":null}';
    }
}
