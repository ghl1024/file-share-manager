name: Build Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '.github/**'
      - '.cnb/**'
      - '.cnb.yml'
      - '.goreleaser.yaml'
      - 'push.sh'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: registry.cn-beijing.aliyuncs.com
  REGISTRY_NAMESPACE: guohailiang
  GOPROXY: https://goproxy.cn,direct

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.component }} Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - server
          - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set build metadata
        id: build_meta
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0" >> "$GITHUB_OUTPUT"
          fi
          echo "go_version=$(awk '/^go / {print $2; exit}' server/go.mod)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fileshare-${{ matrix.component }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAMESPACE }}/fileshare-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Alibaba Cloud ACR rejects Buildx OCI attestation manifests.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=${{ env.GOPROXY }}
            GO_VERSION=${{ steps.build_meta.outputs.go_version }}
            NODE_VERSION=22
            VERSION=${{ steps.build_meta.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
