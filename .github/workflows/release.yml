name: Release
# 推送 v 开头的标签时自动发布，也可手动修复既有 Tag 的 Release。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v1.2.2'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  GOPROXY: https://goproxy.cn,direct

jobs:
  tag_filter:
    name: Tag Change Filter
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Detect whether tag touches non-CI files
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          should_run=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            commit_ref="${GITHUB_SHA}^{commit}"
            commit="$(git rev-parse "$commit_ref")"
            previous_tag="$(git describe --tags --abbrev=0 "${commit}^" 2>/dev/null || true)"
            should_run=false

            if [[ -n "${previous_tag}" ]]; then
              changed_files=(git diff -z --name-only "${previous_tag}" "${commit}")
            else
              changed_files=(git diff-tree -z --no-commit-id --name-only -r --root "${commit}")
            fi

            while IFS= read -r -d '' file; do
              case "$file" in
                .github/**|.cnb/**|.cnb.yml|.goreleaser.yaml|push.sh)
                  ;;
                *)
                  should_run=true
                  break
                  ;;
              esac
            done < <("${changed_files[@]}")
          fi

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: tag_filter
    if: ${{ needs.tag_filter.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Select GoReleaser configuration
        id: release_config
        shell: bash
        run: |
          set -euo pipefail

          config=.goreleaser.yaml
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            default_branch="${{ github.event.repository.default_branch }}"
            git fetch origin "${default_branch}:refs/remotes/origin/${default_branch}"
            config="${RUNNER_TEMP}/goreleaser.yaml"
            git show "refs/remotes/origin/${default_branch}:.goreleaser.yaml" > "${config}"
          fi

          echo "path=${config}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'server/go.mod'
          cache-dependency-path: 'server/go.sum'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Get Go Version
        id: go_version
        run: |
          VERSION="$(go version | awk '{print $3}')"
          {
            echo "GOVERSION=${VERSION}"
            echo "VITE_APP_VERSION=${RELEASE_TAG}"
            echo "VITE_GIT_COMMIT=${GITHUB_SHA}"
            echo "VITE_BUILD_TIME=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_ENV"
          echo "检测到 Go 版本: ${VERSION}"

      # Windows 包构建已在 .goreleaser.yaml 中注释关闭，GitHub 发布只产出 Linux/macOS 包。
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish --config=${{ steps.release_config.outputs.path }}
        env:
          GOVERSION: ${{ env.GOVERSION }}
          VITE_APP_VERSION: ${{ env.VITE_APP_VERSION }}
          VITE_GIT_COMMIT: ${{ env.VITE_GIT_COMMIT }}
          VITE_BUILD_TIME: ${{ env.VITE_BUILD_TIME }}

      - name: Publish GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const path = require('path');
            const tag = process.env.RELEASE_TAG;
            const releaseName = `${tag} 🚀`;
            const expectedAssets = fs.readdirSync('dist')
              .filter((name) =>
                name === 'checksums.txt' ||
                (name.startsWith('fileshare-server_') && name.endsWith('.tar.gz')),
              )
              .sort();

            if (expectedAssets.length !== 5 || !expectedAssets.includes('checksums.txt')) {
              core.setFailed(
                `Expected four archives and checksums.txt, found: ${expectedAssets.join(', ')}`,
              );
              return;
            }

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { ...context.repo, per_page: 100 },
            );
            const candidates = releases.filter((release) =>
              release.tag_name === tag ||
              (release.draft && (release.name === tag || release.name === releaseName)),
            );
            const byOldest = [...candidates].sort((left, right) => left.id - right.id);
            let release =
              candidates.find((item) => item.tag_name === tag && !item.draft) ||
              byOldest.find((item) => item.tag_name === tag && item.name === releaseName) ||
              byOldest[0];

            for (const duplicate of candidates) {
              if (!release || duplicate.id === release.id) {
                continue;
              }
              if (!duplicate.draft) {
                core.setFailed(`Multiple published releases refer to ${tag}.`);
                return;
              }
              core.info(`Deleting duplicate draft Release ${duplicate.id}.`);
              await github.rest.repos.deleteRelease({
                ...context.repo,
                release_id: duplicate.id,
              });
            }

            if (!release) {
              core.info(`Creating draft GitHub Release for ${tag}.`);
              const created = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: tag,
                name: releaseName,
                body: `Automated release ${tag}`,
                draft: true,
                prerelease: false,
              });
              release = created.data;
            } else {
              core.info(`Reusing GitHub Release ${release.id} for ${tag}.`);
            }

            const existingAssets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              { ...context.repo, release_id: release.id, per_page: 100 },
            );
            for (const asset of existingAssets) {
              const generatedAsset =
                asset.name === 'checksums.txt' ||
                (asset.name.startsWith('fileshare-server_') && asset.name.endsWith('.tar.gz'));
              if (!generatedAsset) {
                continue;
              }
              core.info(`Deleting stale asset ${asset.name}.`);
              await github.rest.repos.deleteReleaseAsset({
                ...context.repo,
                asset_id: asset.id,
              });
            }

            for (const name of expectedAssets) {
              const data = fs.readFileSync(path.join('dist', name));
              core.info(`Uploading ${name}.`);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
                data,
              });
            }

            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: release.id,
              tag_name: tag,
              name: releaseName,
              body: release.body || `Automated release ${tag}`,
              draft: false,
              prerelease: false,
              make_latest: 'true',
            });
            core.info(`Published GitHub Release ${tag} with ${expectedAssets.length} assets.`);
