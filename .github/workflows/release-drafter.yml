name: Release Drafter

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.cnb/**'
      - '.cnb.yml'
      - '.goreleaser.yaml'
      - 'push.sh'

permissions:
  contents: write
  pull-requests: read

jobs:
  update-release-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Update release draft
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
