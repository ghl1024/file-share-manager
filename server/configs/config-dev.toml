[server]
  host = "0.0.0.0"
  port = 29000
  mode = "debug"
  web_url = "http://localhost:39000"
  read_header_timeout_seconds = 5
  read_timeout_seconds = 30
  write_timeout_seconds = 60
  idle_timeout_seconds = 120
  shutdown_timeout_seconds = 15
  max_request_body_bytes = 10485760
  max_upload_body_bytes = 115343360
  enable_swagger = false

[database]
  host = "127.0.0.1"
  port = 3306
  user = "fileshare"
  password = "fileshare123"
  dbname = "fileshare"
  max_idle_conns = 10
  max_open_conns = 100
  auto_migrate = true
  # Enable only for short-lived SQL diagnosis; errors and queries slower than
  # 200ms are always recorded.
  log_queries = false

# Required only when audit.archive_enabled=true. The archive worker account
# must be different from the business account and is never used for migration.
[audit_database]
  host = "127.0.0.1"
  port = 3306
  user = ""
  password = ""
  dbname = "fileshare"
  max_idle_conns = 2
  max_open_conns = 5

[storage]
  root_path = "data/storage"
  staging_path = "data/staging"
  mode = "local"
  min_free_bytes = 5368709120
  warn_free_percent = 20
  min_free_percent = 10
  health_check_interval_minutes = 5

[upload]
  allowed_extensions = [".txt", ".md", ".csv", ".json", ".xml", ".yaml", ".yml", ".log", ".conf", ".ini", ".rtf", ".pdf", ".doc", ".docx", ".docm", ".xls", ".xlsx", ".xlsm", ".ppt", ".pptx", ".pptm", ".odt", ".ods", ".odp", ".zip", ".7z", ".rar", ".tar", ".gz", ".tgz", ".png", ".jpg", ".jpeg", ".gif", ".webp", ".bmp", ".svg", ".mp3", ".wav", ".m4a", ".mp4", ".mov", ".avi", ".mkv", ".webm"]
  allow_mime_mismatch = false

[preview]
  max_binary_bytes = 26214400
  max_text_bytes = 1048576

[batch_download]
  max_files = 1000
  max_total_bytes = 5368709120
  retention_hours = 24
  worker_count = 2

[jwt]
  # Development only. Override with FILESHARE_JWT_SECRET for stable sessions.
  secret = "fileshare-development-jwt-secret-change-me"
  expires_hours = 24

[backup]
type = "local"
local_path = "data/backup"
prefix = "fileshare-backup/"
# Development only. Production must inject FILESHARE_BACKUP_MANIFEST_KEY.
manifest_encryption_key = "LpyeDOEk3xNcJoebADaHxHtfpCImwDuXwzoJoBoFB0M="
# Periodically replace long incremental chains with an independently verified
# full baseline. Keep disabled until the deployment backup window is chosen.
compaction_enabled = false
compaction_interval_minutes = 60
compaction_incremental_threshold = 30

[archive]
enabled = false
after_days = 365
batch_size = 100
prefix = "fileshare-archive/"

[audit]
hot_retention_days = 365
export_retention_hours = 24
archive_enabled = false
archive_interval_minutes = 60
archive_batch_size = 10000
archive_prefix = "fileshare-audit/"

[clamav]
host = ""
port = 3310
timeout_seconds = 60
virus_db_max_age_hours = 48
retry_max_attempts = 3
retry_interval_minutes = 5
retry_batch_size = 50

[notification]
credential_encryption_key = "ZmlsZXNoYXJlLW5vdGlmeS1kZXYta2V5LTI2MDgxNCE="
worker_count = 2
poll_interval_seconds = 5
batch_size = 50
max_attempts = 5
base_retry_seconds = 30
max_retry_seconds = 3600

[lifecycle]
interval_minutes = 15
trash_retention_days = 30
upload_session_hours = 24
quarantine_retention_days = 7
reconcile_batch_size = 100

[log]
  level = "debug"
  filename = "logs/fileshare.log"
  directory = "logs/server"
  format = "json"
  split_by_level = true
  max_size = 100
  max_backups = 30
  max_age = 7
  retention_days = 7
  compress = false
  console = true
  rotation_time = "hour"
  reload_on_sighup = true
