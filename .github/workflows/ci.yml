name: CI

on:
  push:
    paths-ignore:
      - '.github/**'
      - '.cnb/**'
      - '.cnb.yml'
      - '.goreleaser.yaml'
      - 'push.sh'
  pull_request:
    paths-ignore:
      - '.github/**'
      - '.cnb/**'
      - '.cnb.yml'
      - '.goreleaser.yaml'
      - 'push.sh'

permissions:
  contents: read

env:
  GOPROXY: https://goproxy.cn,direct

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-check:
    name: Go Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5 # v5.5.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Verify modules
        run: go mod verify
        working-directory: server

      - name: Test
        run: go test ./...
        working-directory: server

      - name: Vet
        run: go vet ./...
        working-directory: server

      - name: Race test
        run: go test -race ./...
        working-directory: server

      - name: Build
        run: go build ./...
        working-directory: server

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build
        working-directory: frontend
        run: npm run build:prod
