x-fileshare-environment: &fileshare-environment
  FILESHARE_DB_HOST: fileshare-db
  FILESHARE_DB_PORT: 3306
  FILESHARE_DB_USER: fileshare
  FILESHARE_DB_PASSWORD: ${FILESHARE_DB_PASSWORD:-change-this-db-password}
  FILESHARE_DB_NAME: fileshare
  FILESHARE_AUDIT_DB_HOST: fileshare-db
  FILESHARE_AUDIT_DB_PORT: 3306
  FILESHARE_AUDIT_DB_USER: ${FILESHARE_AUDIT_DB_USER:-}
  FILESHARE_AUDIT_DB_PASSWORD: ${FILESHARE_AUDIT_DB_PASSWORD:-}
  FILESHARE_AUDIT_DB_NAME: fileshare
  FILESHARE_JWT_SECRET: ${FILESHARE_JWT_SECRET:-replace-with-a-long-random-secret}
  FILESHARE_BOOTSTRAP_ADMIN_PASSWORD: ${FILESHARE_BOOTSTRAP_ADMIN_PASSWORD:-Admin123456789!}
  FILESHARE_WEB_URL: ${FILESHARE_WEB_URL:-http://localhost:39000}
  FILESHARE_STORAGE_ROOT: /data/fileshare
  FILESHARE_STORAGE_STAGING: /data/fileshare/staging
  FILESHARE_STORAGE_MODE: ${FILESHARE_STORAGE_MODE:-local}
  FILESHARE_STORAGE_MIN_FREE_BYTES: ${FILESHARE_STORAGE_MIN_FREE_BYTES:-5368709120}
  FILESHARE_STORAGE_WARN_FREE_PERCENT: ${FILESHARE_STORAGE_WARN_FREE_PERCENT:-20}
  FILESHARE_STORAGE_MIN_FREE_PERCENT: ${FILESHARE_STORAGE_MIN_FREE_PERCENT:-10}
  FILESHARE_STORAGE_HEALTH_INTERVAL_MINUTES: ${FILESHARE_STORAGE_HEALTH_INTERVAL_MINUTES:-5}
  FILESHARE_ALLOWED_EXTENSIONS: ${FILESHARE_ALLOWED_EXTENSIONS:-}
  FILESHARE_PREVIEW_MAX_BINARY_BYTES: ${FILESHARE_PREVIEW_MAX_BINARY_BYTES:-26214400}
  FILESHARE_PREVIEW_MAX_TEXT_BYTES: ${FILESHARE_PREVIEW_MAX_TEXT_BYTES:-1048576}
  FILESHARE_BATCH_DOWNLOAD_MAX_FILES: ${FILESHARE_BATCH_DOWNLOAD_MAX_FILES:-1000}
  FILESHARE_BATCH_DOWNLOAD_MAX_TOTAL_BYTES: ${FILESHARE_BATCH_DOWNLOAD_MAX_TOTAL_BYTES:-5368709120}
  FILESHARE_BATCH_DOWNLOAD_RETENTION_HOURS: ${FILESHARE_BATCH_DOWNLOAD_RETENTION_HOURS:-24}
  FILESHARE_BATCH_DOWNLOAD_WORKER_COUNT: ${FILESHARE_BATCH_DOWNLOAD_WORKER_COUNT:-2}
  FILESHARE_CLAMAV_HOST: ${FILESHARE_CLAMAV_HOST:-}
  FILESHARE_CLAMAV_PORT: ${FILESHARE_CLAMAV_PORT:-3310}
  FILESHARE_CLAMAV_TIMEOUT_SECONDS: ${FILESHARE_CLAMAV_TIMEOUT_SECONDS:-60}
  FILESHARE_CLAMAV_VIRUS_DB_MAX_AGE_HOURS: ${FILESHARE_CLAMAV_VIRUS_DB_MAX_AGE_HOURS:-48}
  FILESHARE_CLAMAV_RETRY_MAX_ATTEMPTS: ${FILESHARE_CLAMAV_RETRY_MAX_ATTEMPTS:-3}
  FILESHARE_CLAMAV_RETRY_INTERVAL_MINUTES: ${FILESHARE_CLAMAV_RETRY_INTERVAL_MINUTES:-5}
  FILESHARE_CLAMAV_RETRY_BATCH_SIZE: ${FILESHARE_CLAMAV_RETRY_BATCH_SIZE:-50}
  FILESHARE_QUARANTINE_RETENTION_DAYS: ${FILESHARE_QUARANTINE_RETENTION_DAYS:-7}
  FILESHARE_RECONCILE_BATCH_SIZE: ${FILESHARE_RECONCILE_BATCH_SIZE:-100}
  FILESHARE_BACKUP_TYPE: ${FILESHARE_BACKUP_TYPE:-local}
  FILESHARE_BACKUP_LOCAL_PATH: ${FILESHARE_BACKUP_LOCAL_PATH:-/data/fileshare/backup}
  FILESHARE_BACKUP_ENDPOINT: ${FILESHARE_BACKUP_ENDPOINT:-}
  FILESHARE_BACKUP_BUCKET: ${FILESHARE_BACKUP_BUCKET:-}
  FILESHARE_BACKUP_PREFIX: ${FILESHARE_BACKUP_PREFIX:-fileshare-backup/}
  FILESHARE_BACKUP_ACCESS_KEY: ${FILESHARE_BACKUP_ACCESS_KEY:-}
  FILESHARE_BACKUP_SECRET_KEY: ${FILESHARE_BACKUP_SECRET_KEY:-}
  FILESHARE_BACKUP_REGION: ${FILESHARE_BACKUP_REGION:-}
  FILESHARE_BACKUP_MANIFEST_KEY: ${FILESHARE_BACKUP_MANIFEST_KEY:-}
  FILESHARE_ARCHIVE_ENABLED: ${FILESHARE_ARCHIVE_ENABLED:-false}
  FILESHARE_ARCHIVE_AFTER_DAYS: ${FILESHARE_ARCHIVE_AFTER_DAYS:-365}
  FILESHARE_ARCHIVE_BATCH_SIZE: ${FILESHARE_ARCHIVE_BATCH_SIZE:-100}
  FILESHARE_ARCHIVE_PREFIX: ${FILESHARE_ARCHIVE_PREFIX:-fileshare-archive/}
  FILESHARE_AUDIT_HOT_RETENTION_DAYS: ${FILESHARE_AUDIT_HOT_RETENTION_DAYS:-365}
  FILESHARE_AUDIT_EXPORT_RETENTION_HOURS: ${FILESHARE_AUDIT_EXPORT_RETENTION_HOURS:-24}
  FILESHARE_AUDIT_ARCHIVE_ENABLED: ${FILESHARE_AUDIT_ARCHIVE_ENABLED:-false}
  FILESHARE_AUDIT_ARCHIVE_INTERVAL_MINUTES: ${FILESHARE_AUDIT_ARCHIVE_INTERVAL_MINUTES:-60}
  FILESHARE_AUDIT_ARCHIVE_BATCH_SIZE: ${FILESHARE_AUDIT_ARCHIVE_BATCH_SIZE:-10000}
  FILESHARE_AUDIT_ARCHIVE_PREFIX: ${FILESHARE_AUDIT_ARCHIVE_PREFIX:-fileshare-audit/}

services:
  fileshare-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: fileshare
      MYSQL_USER: fileshare
      MYSQL_PASSWORD: ${FILESHARE_DB_PASSWORD:-change-this-db-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
    volumes:
      - fileshare-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  fileshare-migrate:
    build: ./server
    entrypoint: ["/app/fs-migrate"]
    command: ["--config", "configs/config-prod.toml"]
    environment: *fileshare-environment
    depends_on:
      fileshare-db:
        condition: service_healthy
    restart: "no"

  fileshare-server:
    build: ./server
    command: ["--env=prod"]
    environment: *fileshare-environment
    ports:
      - "${FILESHARE_API_PORT:-29000}:29000"
    volumes:
      - fileshare-data:/data/fileshare
    depends_on:
      fileshare-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:29000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  fileshare-web:
    build: ./frontend
    ports:
      - "${FILESHARE_HTTP_PORT:-39000}:80"
    depends_on:
      fileshare-server:
        condition: service_healthy

volumes:
  fileshare-db:
  fileshare-data:
